[workspace]
resolver = "3"
members = [
    "crates/setup-core",
    "crates/pi-setup-system",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/NDDev-OpenNetwork/pi-setup-system"
authors = ["Danil Silantyev / NDDev"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
fs4 = { version = "0.13", features = ["sync"] }
setup-core = { path = "crates/setup-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
