[workspace]
resolver = "3"
members = [
    "crates/setup-core",
    "crates/provider-v3",
    "crates/harness-runtime",
    "crates/pi-setup-system",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/NDDev-OpenNetwork/pi-setup-system"
authors = ["Danil Silantyev / NDDev"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
setup-core = { path = "crates/setup-core", version = "0.0.1" }
provider-v3 = { path = "crates/provider-v3", version = "0.0.1" }
harness-runtime = { path = "crates/harness-runtime", version = "0.0.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
