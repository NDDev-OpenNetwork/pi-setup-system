[workspace]
resolver = "3"
members = [
    "crates/setup-core",
    "crates/provider-v3",
    "crates/harness-runtime",
    "crates/pi-setup-system",
]

[workspace.package]
version = "0.0.89"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/NDDev-OpenNetwork/pi-setup-system"
authors = ["Danil Silantyev / NDDev"]

[workspace.dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
# Prefix allocation owns no-replace publication and caller-UID checks on Unix.
# Remove this direct dependency when cap-std supplies the same primitive.
rustix = { version = "=1.1.5", features = ["fs", "process"] }
# Prefix publication uses safe Windows calls without std::fs::rename's
# replacement fallback. Remove these when cap-std offers no-replace rename.
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }
winx = "=0.36.4"
# The software metadata store owns these dependencies. SQLite supplies atomic
# records; the VFS bridge confines every file to held directory capabilities.
# The bridge can be replaced without changing the stored SQL contract.
rusqlite = { version = "=0.40.2", features = ["bundled", "limits"] }
sqlite-plugin = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
# DEFLATE only. The gzip framing and the tar reading are ours (see
# `setup-core::archive`); an inflate loop is not, because its bugs are
# memory-safety bugs and it is not improved by being hand-written here.
miniz_oxide = "0.9"
setup-core = { path = "crates/setup-core", version = "0.0.89" }
provider-v3 = { path = "crates/provider-v3", version = "0.0.89" }
harness-runtime = { path = "crates/harness-runtime", version = "0.0.89" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
