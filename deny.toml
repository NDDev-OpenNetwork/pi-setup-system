# cargo-deny: bans, licences, advisories and sources.
#
# The workspace is deliberately small. Every dependency below is one this
# kernel could not reasonably implement itself, and each is named here so a new
# transitive arrival is a review, not a surprise.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive only. The binary is AGPL-3.0-or-later; a copyleft dependency would
# be fine for us and hostile to anyone vendoring the kernel, so it is refused
# here rather than discovered downstream.
allow = [
    # Ours. cargo-deny evaluates the workspace's own crates alongside their
    # dependencies, so the project licence belongs in this list too.
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# An allowance no crate currently matches is a curated intent, not a defect.
# Failing on one would make removing a dependency break the build.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Every crate this workspace resolves, named. Anything else fails the build.
#
# An **allowlist**, not a list of forbidden networking crates, and the direction
# is the point: a denylist catches only the ones somebody thought of, while this
# fails on *any* new dependency until a person adds it -- which is the moment to
# ask what it does. The third-party entries are all filesystem, serialization,
# hashing and compression; not one opens a socket, measured on the released
# binaries as zero network symbols imported and only libc and libgcc_s linked.
#
# Workspace members are listed too. An earlier version of this comment said
# cargo-deny scopes `allow` to external crates; it does not, and
# `cargo deny check bans` said so in ten lines. The tool was right and the note
# was a claim nobody had measured.
#
# A rendered public tree carries this file and builds one harness crate rather
# than seven, so six entries there match nothing. Deliberate: one file, rendered
# verbatim, and an entry matching nothing costs nothing.
#
# Adding a dependency is a two-line change and a decision. Removing this list to
# make a build pass is not a shortcut -- it is the guard.
allow = [
    { crate = "antigravity-setup-system" },
    { crate = "claude-setup-system" },
    { crate = "codex-setup-system" },
    { crate = "cursor-setup-system" },
    { crate = "grok-setup-system" },
    { crate = "harness-runtime" },
    { crate = "opencode-setup-system" },
    { crate = "pi-setup-system" },
    { crate = "provider-v3" },
    { crate = "setup-core" },
    { crate = "adler2" },
    { crate = "block-buffer" },
    { crate = "cfg-if" },
    { crate = "const-oid" },
    { crate = "cpufeatures" },
    { crate = "crypto-common" },
    { crate = "digest" },
    { crate = "equivalent" },
    { crate = "hashbrown" },
    { crate = "hybrid-array" },
    { crate = "indexmap" },
    { crate = "itoa" },
    { crate = "libc" },
    { crate = "memchr" },
    { crate = "miniz_oxide" },
    { crate = "proc-macro2" },
    { crate = "quote" },
    { crate = "serde" },
    { crate = "serde_core" },
    { crate = "serde_derive" },
    { crate = "serde_json" },
    { crate = "sha2" },
    { crate = "syn" },
    { crate = "typenum" },
    { crate = "unicode-ident" },
    { crate = "zmij" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
