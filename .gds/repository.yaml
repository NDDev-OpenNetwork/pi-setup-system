relationships:
  # Every file in this repository is rendered from the private authoring
  # workspace by `tools/render_public_trees.py`; a hand edit here is overwritten
  # by the next render. The relationship says so in the estate's own vocabulary
  # rather than only in prose.
  #
  # **Declared the day the engine could accept it, and not before.** The member
  # `generated-from` was merged after `gds-v0.7.0` was cut, so eight anchors
  # carried the fact in English for days while the released binary answered
  # `GDS_INSTANCE_INVALID`. Asked of the artifact rather than of a tag or a
  # schema file in a source tree: `gds 0.8.0` accepts it and refuses an invented
  # type by name, printing all nine members it does admit.
  - type: "generated-from"
    target: "repo_01M0QNDKCJ0K9XZHXVPCERB4XK"

product:
  purpose: >-
    An ai-stp provider-protocol v3 setup system for Pi Coding Agent: it
    installs, reselects, restores and removes a complete harness configuration
    in a caller-named target directory, and owns the program lifecycle as well as the configuration.
  capabilities:
    - "install, reinstall and reselect a complete harness setup"
    - "restore the last backup or a chosen one by reference"
    - "recover an interrupted mutation from its durable journal"
  entrypoints:
    - change: "the shared lock, journal, backup and atomic-apply kernel"
      path: "crates/setup-core"
    - change: "the ai-stp provider protocol v3 wire boundary"
      path: "crates/provider-v3"
    - change: "the provider command runtime every setup system shares"
      path: "crates/harness-runtime"
    - change: "this harness's verified facts"
      path: "crates/pi-setup-system"
    - change: "the setup catalog"
      path: "setups"

policy:
  profiles:
    - "repository-default"
    - "opennetwork-default"
  rollout_ring: "standard"

git:
  default_branch: "main"
  integration: "pull-request"
  branch_model: "task-branches"
  handoff_pr: "preferred"
  cleanup: "merged-only"

verification:
  commands:
    build:
      - "cargo build --locked --all-targets"
    test:
      - "cargo test --locked --all-targets"
    lint:
      - "cargo clippy --locked --all-targets -- -D warnings"
      - "cargo fmt --all --check"
  required:
    - "test"
    - "lint"
  required_contexts:
    - "rust / test (ubuntu-latest)"
    - "rust / test (macos-latest)"
    - "rust / test (windows-latest)"
    - "rust / rustfmt"
    - "rust / clippy"
    - "supply-chain / cargo-deny"
    - "supply-chain / cargo-audit"
    - "supply-chain / cargo-machete"
    - "actionlint / actionlint"
    - "codeql / CodeQL (rust)"
    - "codeql / CodeQL (actions)"
    - "osv / osv-scan"
    - "zizmor / zizmor (SARIF)"
    - "secret-scan / Gitleaks secret scan"

agent:
  context_profile: "public-module"
  generated_agents: false
  serena:
    enabled: false
    provenance_required: false

release:
  mode: "github-release"
  tag_style: "semver"
