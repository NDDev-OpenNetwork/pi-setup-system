name: publish-crates

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: publish-crates-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: package, verify and publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io exchanges this OIDC identity for one short-lived publish token
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Build the self-contained crate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "$version" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          python3 tools/build_crates_io.py --out crates-io --harness pi --version "$version"
          cargo package --manifest-path crates-io/pi-setup-system/Cargo.toml
          cargo install --path crates-io/pi-setup-system --root crates-io/install --locked
          crates-io/install/bin/pi-setup-system provider-info > crates-io/provider-info.json
          test "$(jq -r .provider_id crates-io/provider-info.json)" = "pi-setup-system"

      - name: Mint a short-lived crates.io token
        id: crates
        uses: rust-lang/crates-io-auth-action@82864bf380abd3e242c564a5ba58dd29d6265b00

      - name: Publish pi-setup-system
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}
        run: cargo publish --manifest-path crates-io/pi-setup-system/Cargo.toml
