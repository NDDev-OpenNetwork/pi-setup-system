name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # There was no way to ask this repository for a run, and on 2026-08-26 that
  # mattered: GitHub dropped push events for about two hours, and six of the
  # seven trees were left with no completed `ci` on the `main` they had just
  # merged. The code was proven -- the same contexts were green on the pull
  # request minutes earlier -- but nothing on `main` said so, and the only way
  # to ask again was to push a commit that changed nothing.
  #
  # A repository whose proof can only be requested by changing it is a
  # repository that invites empty commits. The monorepo has carried this
  # trigger since its gate was built; the rendered trees did not, for no reason
  # anyone chose.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/rust-ci.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b
    with:
      toolchain: '1.98.0'
      # The three-OS matrix is the evidence ADR-0113 asks for, and standard
      # hosted runners are free with unlimited minutes on a public repository.
      test_matrix_os: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      build_command: 'cargo build --locked --all-targets'
      test_command: 'cargo test --locked --all-targets'
      fmt_command: 'cargo fmt --all --check'
      clippy_command: 'cargo clippy --locked --all-targets -- -D warnings'
      msrv_toolchain: '1.89'

  supply-chain:
    name: supply-chain
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/rust-supply-chain.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b
    with:
      enable_deny: true
      enable_audit: true
      enable_machete: true

  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/actionlint.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b

  pr-hygiene:
    name: pr-hygiene
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      # The labeler applies labels and the stale bot closes threads. Their jobs
      # declare these statically, so the grant is required even when the toggle
      # that would use them is off.
      issues: write
      pull-requests: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/pr-hygiene.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b
