name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so an advisory published after the last push is still seen.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    name: codeql
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-codeql.yml@5adeab2d8b168b68b8cab8c04cb28ed98b36fe80
    with:
      languages: '["rust", "actions"]'
      queries: security-and-quality

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-dependency-review.yml@5adeab2d8b168b68b8cab8c04cb28ed98b36fe80
    with:
      fail_on_severity: moderate

  scorecard:
    name: scorecard
    if: github.event_name != 'pull_request'
    permissions:
      # A called workflow cannot request more than its caller granted, and the
      # run fails at startup rather than mid-job when it tries. Scorecard reads
      # workflow definitions, so actions: read is part of the set, not an extra.
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-scorecard.yml@5adeab2d8b168b68b8cab8c04cb28ed98b36fe80

  osv:
    name: osv
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/osv-scan.yml@5adeab2d8b168b68b8cab8c04cb28ed98b36fe80

  zizmor:
    name: zizmor
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/zizmor-sarif.yml@5adeab2d8b168b68b8cab8c04cb28ed98b36fe80

  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/secret-scan.yml@5adeab2d8b168b68b8cab8c04cb28ed98b36fe80
