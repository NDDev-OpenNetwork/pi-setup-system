name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, so an advisory published after the last push is still seen.
    - cron: '17 4 * * 1'
  # Same reason as `ci`: an advisory worth re-checking now, or a scheduled run
  # that never started, should not require a commit to ask about.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    name: codeql
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-codeql.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b
    with:
      languages: '["rust", "actions"]'
      queries: security-and-quality

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-dependency-review.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b
    with:
      fail_on_severity: moderate

  scorecard:
    name: scorecard
    if: github.event_name != 'pull_request'
    permissions:
      # A called workflow cannot request more than its caller granted, and the
      # run fails at startup rather than mid-job when it tries. Scorecard reads
      # workflow definitions, so actions: read is part of the set, not an extra.
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-scorecard.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b

  osv:
    name: osv
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/osv-scan.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b

  zizmor:
    name: zizmor
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/zizmor-sarif.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b

  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/secret-scan.yml@66fc19d6ee02c703bc219aa4f31d5f98a3def54b
