version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # A version published minutes ago has been reviewed by nobody. The cooldown
    # is the cheapest defence against a compromised release being pulled in
    # before anyone has looked at it, and costs only a few days of latency on
    # updates that were never urgent.
    cooldown:
      default-days: 7
      semver-major-days: 14

  # The reusable workflows are pinned to a commit, never a tag, so a moved tag
  # cannot change what runs. Refreshing that pin is a reviewed change.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
      semver-major-days: 14
